# ======================================================
# APP
# ======================================================
spring.application.name=CarburoAPI

# ======================================================
# Configuración HTTP - SERVER
# ======================================================
server.port=8089
server.forward-headers-strategy=framework

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ======================================================
# Status/Health - Actuator
# ======================================================
management.endpoints.web.base-path=/public/status
management.endpoints.web.exposure.include=health, info
management.info.build.enabled=true
management.info.env.enabled=true
info.app.name=Carburo App
info.app.url=https://carburo.app
info.api.name=Carburo API REST
info.api.url=https://api.carburo.app
info.version=@project.version@
info.api.description=@project.description@
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# ======================================================
# Configuración de la BD PostgreSQL
# ======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# JPA/Hibernate
# ======================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ======================================================
# LOGGING
# ======================================================
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR

# =========================
# API BASE PATH
# =========================
server.servlet.context-path=/api

# =========================
# JSON
# =========================
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# =========================
# SECURITY (CUSTOM)
# =========================
security.api.key=${PUBLIC_API_KEY}

# Supabase
security.jwt.issuer=${SUPABASE_ISSUER}
security.jwt.jwks-url=${SUPABASE_JWKS_URL}

# =========================
# CACHE
# =========================
spring.cache.type=caffeine
spring.cache.cache-names=dtos_grupo_combustibles,dtos_combustibles,entities_grupo_combustibles,entities_combustibles,grupo_combustibles,ccaa,provincias,municipios,municipiosConEESS,eess_count,combustibles_analiticas_hoy
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=12h,recordStats

# ======================================================
# Optimización del Pool de Conexiones (HikariCP)
# ======================================================
# Subimos el tamaño máximo del pool de 10 a 20 (asumible en local)
spring.datasource.hikari.maximum-pool-size=20

# Número mínimo de conexiones inactivas que Hikari mantiene vivas
spring.datasource.hikari.minimum-idle=5

# Evita el retardo de reactivación: Mantiene las conexiones abiertas en el pool
# durante 10 minutos (600000ms) antes de limpiarlas por desuso
spring.datasource.hikari.idle-timeout=600000

# Tiempo máximo de vida de una conexión en el pool (30 minutos)
spring.datasource.hikari.max-lifetime=1800000

# Cuánto tiempo espera un hilo por una conexión antes de fallar (la bajamos a 10s o 15s)
# Si hay saturación, es mejor dar un error rápido que congelar al usuario 30 segundos
spring.datasource.hikari.connection-timeout=15000