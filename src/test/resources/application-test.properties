# =====================================================================
# SOBREESCRITURA DE PROPIEDADES PARA ENTORNO DE TEST
# (Todo lo que no esté aquí, se heredará del application.properties normal)
# =====================================================================

# Cambiamos el puerto para poder testear mientras el backend real está desplegado
server.port=8087
server.servlet.context-path=/apis

# Configuración del motor H2 imitando compatibilidad con PostgreSQL
spring.datasource.url=jdbc:h2:mem:carburo_test;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.level.org.hibernate.orm.boot=DEBUG

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivamos caché para evitar contaminación entre baterías de tests
spring.cache.type=none

# 4. Pisamos las claves de seguridad con valores fijos (Evitamos conectar con Supabase en los tests)
security.api.key=test_api_key_manual_123456
security.jwt.issuer=https://mock-supabase.com
security.jwt.jwks-url=https://mock-supabase.com/v1/auth/keys